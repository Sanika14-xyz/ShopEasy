name: ShopEasy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npm test
      - name: Build web app
        run: npm run build

  browser-tests:
    name: Selenium browser test
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Start the app
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Seed the product catalog
        run: docker compose exec --no-TTY api npm run seed --workspace=@shopeasy/api
      - name: Test search and shopping bag
        run: npm run test:e2e
      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Stop the app
        if: always()
        run: docker compose down

  publish-images:
    name: Publish Docker images
    needs: [test-and-build, browser-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: api/Dockerfile
          - component: web
            dockerfile: web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shopeasy-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sonarqube:
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
