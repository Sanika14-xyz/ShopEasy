apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-blue
  namespace: shopeasy-release
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      color: blue
  template:
    metadata:
      labels:
        app: api
        color: blue
    spec:
      initContainers:
        - name: wait-for-mongo
          image: mongo:8
          command:
            - /bin/sh
            - -c
          args:
            - |
              until mongosh "$MONGODB_URI" --quiet --eval 'quit(db.adminCommand("ping").ok ? 0 : 1)' >/dev/null 2>&1; do
                echo "Waiting for MongoDB..."
                sleep 2
              done
          env:
            - name: MONGODB_URI
              value: mongodb://mongo.shopeasy.svc.cluster.local:27017/shopeasy
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
      containers:
        - name: api
          image: shopeasy-api:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: MONGODB_URI
              value: mongodb://mongo.shopeasy.svc.cluster.local:27017/shopeasy
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
