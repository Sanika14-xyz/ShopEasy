global:
  slack_api_url_file: /run/secrets/slack_webhook_url

route:
  receiver: shopeasy-slack
  group_by:
    - alertname
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: shopeasy-slack
    slack_configs:
      - send_resolved: true
        title: '{{ .CommonLabels.alertname }}: {{ .Status | toUpper }}'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
